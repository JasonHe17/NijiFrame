# SPDX-License-Identifier: GPL-3.0-only
[versions]
agp = "8.13.2"
kotlin = "2.2.21"
compose = "2025.10.01"
activity = "1.11.0"
lifecycle = "2.9.4"
coroutines = "1.8.1"
serialization = "1.9.0"
exif = "1.4.2"
junit = "4.13.2"
core = "1.15.0"
runner = "1.6.2"
uiautomator = "2.4.0"

[libraries]
androidx-core = { module = "androidx.core:core", version.ref = "core" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
exif = { module = "androidx.exifinterface:exifinterface", version.ref = "exif" }
junit = { module = "junit:junit", version.ref = "junit" }
test-core = { module = "androidx.test:core", version = "1.6.1" }
test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
test-runner = { module = "androidx.test:runner", version.ref = "runner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
