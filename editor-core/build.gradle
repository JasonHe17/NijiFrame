plugins { alias(libs.plugins.kotlin.jvm); alias(libs.plugins.kotlin.serialization) }
kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
dependencies { implementation libs.serialization.json; testImplementation libs.junit }

// A real heap ceiling catches accidental archive/source duplication during large-project reads.
def boundedHeapTest = tasks.register('boundedHeapTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/BoundedHeapProjectTest.class'
    maxHeapSize = '96m'
}
tasks.named('test') {
    exclude '**/BoundedHeapProjectTest.class'
    dependsOn boundedHeapTest
}
