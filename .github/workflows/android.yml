# SPDX-License-Identifier: GPL-3.0-only
name: Android checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Command-line Tools 22.0; older tools misparse API 37.0 AVD targets.
          cmdline-tools-version: '15859902'
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3; validates wrapper
      - name: Install declared Android components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Emulator preparation fault checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Unit tests, APK and lint
        run: ./gradlew :editor-core:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Check native library alignment for 16 KB pages
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/check-apk-native.py app/build/outputs/apk/debug/app-debug.apk > app/build/native-alignment.json
      - name: Native checks with sanitizers
        run: |
          cmake -S image-core/src/main/cpp -B build/native -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native
          ctest --test-dir build/native --output-on-failure
      - name: Record APK provenance
        run: python3 scripts/apk-provenance.py app/build/outputs/apk/debug/app-debug.apk
      - name: Retain APK and build reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-build-${{ github.sha }}
          retention-days: 7
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.sha256
            app/build/outputs/apk/debug/*.provenance.json
            app/build/reports/lint-results-debug.*
            app/build/native-alignment.json
            app/build/reports/tests/
            app/build/test-results/
            editor-core/build/reports/tests/
            editor-core/build/test-results/
            build/native/Testing/
  emulator:
    strategy:
      fail-fast: false
      matrix:
        # Codec boundaries: Android 12 AVIF and Android 14 gainmap APIs.
        api: [29, 31, 34, 36]
        image: [default]
        include:
          - api: 35
            image: google_apis
          - api: '37.0'
            image: google_apis
          - api: 35
            image: google_apis_ps16k
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Command-line Tools 22.0; older tools misparse API 37.0 AVD targets.
          cmdline-tools-version: '15859902'
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Install SDK and emulator
        shell: bash
        run: |
          niji_packages=('platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1' 'emulator' 'system-images;android-${{ matrix.api }};${{ matrix.image }};x86_64')
          if [ '${{ matrix.image }}' = google_apis_ps16k ]; then
            niji_packages+=('system-images;android-36;default;x86_64')
          fi
          # SDK downloads can be interrupted before ZIP validation. Bound retries to
          # infrastructure setup; app tests themselves are never retried here.
          for attempt in 1 2 3; do
            if sdkmanager "${niji_packages[@]}"; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Compile test APKs before emulator boot
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run Android project, local editing and UI checks
        shell: bash
        run: |
          sudo chmod a+rw /dev/kvm
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name ci --device pixel_6 --path "$ANDROID_AVD_HOME/ci.avd" --package 'system-images;android-${{ matrix.api }};${{ matrix.image }};x86_64'
          test -f "$ANDROID_AVD_HOME/ci.ini"
          test "$(sed -n 's/^target=//p' "$ANDROID_AVD_HOME/ci.ini")" = 'android-${{ matrix.api }}'
          # Google APIs images need more userdata space than the AVD CLI default.
          sed -i '/^disk.dataPartition.size=/d' "$ANDROID_AVD_HOME/ci.avd/config.ini"
          echo 'disk.dataPartition.size=6G' >> "$ANDROID_AVD_HOME/ci.avd/config.ini"
          niji_kernel_args=()
          if [ '${{ matrix.image }}' = google_apis_ps16k ]; then
            # API35 rev5 ships a pre-fix 6.6.50 kernel. Its emulated 16KiB/UFFD
            # combination can corrupt ART-managed state, including system apps.
            # Use the official Android15 GKI from API36 default rev2; see
            # docs/android-16k-runtime.md for provenance and the upstream fix.
            niji_kernel="$ANDROID_HOME/system-images/android-36/default/x86_64/kernel-ranchu"
            echo "3f366c20522314f8ccbef89210eabec3491d18997799882e1f0d4d8134e8b937  $niji_kernel" | sha256sum --check
            file "$niji_kernel" > emulator-kernel.txt
            sha256sum "$niji_kernel" >> emulator-kernel.txt
            niji_kernel_args=(-kernel "$niji_kernel")
          fi
          "$ANDROID_HOME/emulator/emulator" -avd ci -port 5554 "${niji_kernel_args[@]}" -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader > emulator.log 2>&1 &
          niji_emulator_pid=$!
          finish() {
            niji_exit_status=$?
            trap - EXIT
            bash scripts/collect-emulator-evidence.sh emulator-5554 app/build/emulator-evidence || true
            adb -s emulator-5554 emu kill || true
            kill "$niji_emulator_pid" 2>/dev/null || true
            exit "$niji_exit_status"
          }
          trap finish EXIT
          echo boot > emulator-phase.txt
          for attempt in {1..90}; do
            if ! kill -0 "$niji_emulator_pid" 2>/dev/null; then cat emulator.log; exit 1; fi
            if [ "$(timeout 10s adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(timeout 10s adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1
          echo framework-preparation > emulator-phase.txt
          niji_page_size=4096
          niji_runtime_args=()
          if [ '${{ matrix.image }}' = google_apis_ps16k ]; then
            niji_page_size=16384
            niji_runtime_args=(--expect-gc CC)
          fi
          python3 scripts/prepare-test-emulator.py --serial emulator-5554 --page-size "$niji_page_size" "${niji_runtime_args[@]}"
          echo application-tests > emulator-phase.txt
          if ./gradlew --no-daemon --max-workers=2 :app:connectedDebugAndroidTest; then niji_test_status=0; else niji_test_status=$?; fi
          echo "application-tests-exit-$niji_test_status" > emulator-phase.txt
          exit "$niji_test_status"
      - name: Retain Android test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-api-${{ matrix.api }}-${{ github.sha }}
          retention-days: 7
          path: |
            emulator.log
            emulator-phase.txt
            emulator-kernel.txt
            app/build/emulator-evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/ui-evidence/
            app/build/emulator-logcat.txt
