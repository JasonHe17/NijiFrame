# SPDX-License-Identifier: GPL-3.0-only
name: Android foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3; validates wrapper
      - name: Install declared Android components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Unit tests, APK and lint
        run: ./gradlew :editor-core:test :app:assembleDebug :app:lintDebug
      - name: Native checks with sanitizers
        run: |
          cmake -S image-core/src/main/cpp -B build/native -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native
          ctest --test-dir build/native --output-on-failure
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Install SDK and emulator
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1' 'emulator' 'system-images;android-36;default;x86_64'
      - name: Run Android file and rendering checks
        shell: bash
        run: |
          sudo chmod a+rw /dev/kvm
          echo no | avdmanager create avd --name ci --package 'system-images;android-36;default;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          trap 'adb emu kill || true' EXIT
          timeout 180 adb wait-for-device
          timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb shell input keyevent 82
          ./gradlew :app:connectedDebugAndroidTest
